services:
  ai-api:
    build: .
    ports:
      - "8000:8000"
    environment:
      ENV: development
      LOG_LEVEL: INFO
      CORS_ORIGINS: "*"
      PORT: "8000"
      MAX_UPLOAD_SIZE_MB: "10"
    volumes:
      - ./main.py:/app/main.py
      - ./api:/app/api
      - ./core:/app/core
      - ./domains:/app/domains
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
