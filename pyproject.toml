[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-ai-api"
version = "0.1.0"
description = "Nexus Bank AI platform API (KYC now, AML later)"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Nexus Bank" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
