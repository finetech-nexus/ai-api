# Build and push ai-api Docker image on push to develop/master.
# Tags: latest, <short-sha> (multi-arch manifest of amd64 + arm64).
#
# Each arch builds natively. PaddleOCR SIGSEGVs under QEMU, so a single
# QEMU multi-platform build cannot warm the arm64 image.
# Secrets: DOCKER_USER, DOCKER_PASSWORD. Optional var: DOCKER_ORGANIZATION (default nexusbank).
name: Build and push image

on:
  push:
    branches: [develop, master]
  workflow_dispatch:

env:
  IMAGE_NAME: ai-api
  DOCKER_ORGANIZATION: ${{ vars.DOCKER_ORGANIZATION || 'nexusbank' }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      short_sha: ${{ steps.sha.outputs.short_sha }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Git short SHA
        id: sha
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.DOCKER_ORGANIZATION }}/${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.short_sha }}-${{ matrix.suffix }}

  manifest:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Create multi-arch manifest
        env:
          IMAGE: ${{ env.DOCKER_ORGANIZATION }}/${{ env.IMAGE_NAME }}
          SHA: ${{ needs.prepare.outputs.short_sha }}
        run: |
          docker buildx imagetools create \
            -t "${IMAGE}:latest" \
            -t "${IMAGE}:${SHA}" \
            "${IMAGE}:${SHA}-amd64" \
            "${IMAGE}:${SHA}-arm64"

      - name: Inspect
        env:
          IMAGE: ${{ env.DOCKER_ORGANIZATION }}/${{ env.IMAGE_NAME }}
          SHA: ${{ needs.prepare.outputs.short_sha }}
        run: docker buildx imagetools inspect "${IMAGE}:${SHA}"
