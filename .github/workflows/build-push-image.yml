# Build and push ai-api Docker image on push to main.
# Tags: latest, <short-sha>
# Secrets: DOCKER_USER, DOCKER_PASSWORD. Optional var: DOCKER_ORGANIZATION (default nexusbank).
name: Build and push image

on:
  push:
    branches: [develop, master]
  workflow_dispatch:

env:
  IMAGE_NAME: ai-api
  DOCKER_ORGANIZATION: ${{ vars.DOCKER_ORGANIZATION || 'nexusbank' }}

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Git short SHA
        id: sha
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.DOCKER_ORGANIZATION }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.DOCKER_ORGANIZATION }}/${{ env.IMAGE_NAME }}:${{ steps.sha.outputs.short_sha }}
