          minimum: 0.0
          title: Confidence
          description: Overall OCR confidence
        extracted_text:
          type: string
          title: Extracted Text
          description: Full raw text extracted
        fields:
          allOf:
          - $ref: '#/components/schemas/OCRFields'
          description: Structured extracted fields
      type: object
      required:
      - document_type
      - confidence
      - extracted_text
      - fields
      title: OCRData
      description: OCR extraction result.
    OCRFields:
      properties:
        full_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Full Name
        date_of_birth:
          anyOf:
          - type: string
          - type: 'null'
          title: Date Of Birth
        document_number:
          anyOf:
          - type: string
          - type: 'null'
          title: Document Number
        nationality:
          anyOf:
          - type: string
          - type: 'null'
          title: Nationality
        issue_date:
          anyOf:
          - type: string
          - type: 'null'
          title: Issue Date
        expiry_date:
          anyOf:
          - type: string
          - type: 'null'
          title: Expiry Date
        place_of_birth:
          anyOf:
          - type: string
          - type: 'null'
          title: Place Of Birth
        address:
          anyOf:
          - type: string
          - type: 'null'
          title: Address
        gender:
          anyOf:
          - type: string
          - type: 'null'
