      title: OCRFields
      description: Structured fields extracted from ID document.
    OCROnlyResponse:
      properties:
        ocr_data:
          $ref: '#/components/schemas/OCRData'
        processing_time_ms:
          type: integer
          title: Processing Time Ms
        timestamp:
          type: string
          format: date-time
          title: Timestamp
      type: object
      required:
      - ocr_data
      - processing_time_ms
      title: OCROnlyResponse
      description: Response for OCR-only endpoint.
      example:
        ocr_data:
          confidence: 0.88
          document_type: drivers_license
          extracted_text: 'Name: Jane Smith | DOB: 15/03/1985'
          fields:
            date_of_birth: 15/03/1985
            full_name: Jane Smith
        processing_time_ms: 3200
        timestamp: '2024-10-11T10:30:00Z'
    SimilarityMetrics:
      properties:
        cosine_similarity:
          type: number
          maximum: 1.0
          minimum: -1.0
          title: Cosine Similarity
        euclidean_distance:
          type: number
          minimum: 0.0
          title: Euclidean Distance
      type: object
      required:
      - cosine_similarity
      - euclidean_distance
      title: SimilarityMetrics
      description: Face similarity metrics.
    ValidationError:
      properties:
